<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce Store</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center w-100">
                <a href="index.html" class="navbar-brand" style="color: white; text-decoration: none;">
                    <i class="fa-solid fa-globe"></i> E-Commerce Store
                </a>
                <div class="d-flex align-items-center">
                    <div id="authButtons"></div>
                    <a href="#" onclick="showCart(); return false;" style="color: white; text-decoration: none; margin-right: 20px; position: relative;">
                        <span class="authBtn"></i></span>
                        <span class="cartBtn"><i class="fa-solid fa-cart-shopping"></i></span>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="card mb-4">
            <div class="card-body" style="padding: 20px;">
                <div class="row">
                    <div class="col-md-8">
                        <div style="display: flex; gap: 10px;">
                            <input type="text" id="searchInput" class="form-control" placeholder="Search products..." style="flex: 1;">
                            <button class="btn btn-primary" onclick="searchProducts()">Search</button>
                            <button class="btn btn-secondary" onclick="loadProducts(); clearInput();">Clear</button>
                        </div>
                    </div>
                </div>
                <div class="row mt-3">
                    <div class="col">
                        <div id="categoryFilters" style="display: flex; gap: 10px; flex-wrap: wrap;">
                            <button class="btn btn-outline category-btn active" data-category="all" onclick="filterByCategory('all')">
                                All Products
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="productsContainer" class="row">
            <div class="col-md-12 text-center">
                <div class="spinner"></div>
                <p>Loading products...</p>
            </div>
        </div>
    </div>

    <div id="cartModal" class="modal">
        <div class="modal-content" style="max-width: 1000px;">
            <span class="modal-close" onclick="closeCart()">&times;</span>
            <h2>Shopping Cart</h2>
            
            <div id="cartItems" class="mt-3"></div>
            
            <div id="cartSummary" class="mt-4" style="border-top: 2px solid #ddd; padding-top: 20px;">
                <div class="d-flex justify-content-between align-items-center">
                    <h3>Total:</h3>
                    <h3 id="cartTotal" style="color: #667eea;">$0.00</h3>
                </div>
                <div class="mt-3 d-flex gap-2" style="gap: 10px;">
                    <button class="btn btn-secondary" onclick="clearCart(); renderCart();">Clear Cart</button>
                    <button class="btn btn-primary" onclick="proceedToCheckout()" style="flex: 1;">Proceed to Checkout</button>
                </div>
            </div>
            
            <div id="emptyCart" class="text-center mt-3" style="display: none;">
                <p>Your cart is empty</p>
                <button class="btn btn-primary" onclick="closeCart()">Continue Shopping</button>
            </div>
        </div>
    </div>

    <button id="backToTop" class="backToTopbtn"><i class="fa-solid fa-arrow-up"></i></button>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
